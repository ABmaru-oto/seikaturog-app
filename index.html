<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活ログ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#f0f0f0;
}

.app {
  max-width:420px;
  margin:auto;
  background:white;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* 余白のベース */
.container {
  padding:16px;
}

/* ヘッダー */
.header {
  padding:16px;
  font-weight:bold;
}

/* カード */
.card {
  background:#fafafa;
  margin-bottom:16px;
  padding:14px;
  border-radius:12px;
}

/* 入力 */
input {
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:none;
  background:#eee;
  border-radius:8px;
  box-sizing:border-box;
}

/* ボタン */
button {
  padding:10px;
  margin:4px;
  border:none;
  border-radius:10px;
}

.main {
  width:100%;
  background:black;
  color:white;
  padding:12px;
}

/* タグ */
.tag.active {
  background:black;
  color:white;
}

/* スライダー */
input[type=range] {
  width:100%;
  margin:12px 0;
}

/* タブ */
.tabbar {
  margin-top:auto;
  display:flex;
  border-top:1px solid #ddd;
}

.tab {
  flex:1;
  text-align:center;
  padding:12px;
}

.activeTab {
  font-weight:bold;
}
</style>
</head>

<body>
<div class="app">

<div class="header">生活ログ</div>

<!-- 日付 -->
<div class="container">
  <div class="card">
    <input type="date" id="date" onchange="render()">
  </div>
</div>

<!-- 記録 -->
<div id="logScreen" class="container">
  <div class="card">
    <input id="text" placeholder="やったこと">
    <input id="tagInput" placeholder="タグ">
    <button class="main" onclick="addLog()">追加</button>
  </div>

  <div id="tagButtons"></div>
  <div id="list"></div>
</div>

<!-- 睡眠 -->
<div id="sleepScreen" class="container" style="display:none;">
  <div class="card">

    起床
    <input type="range" min="0" max="23" id="wake" oninput="updateLabels()">
    <div id="wakeLabel"></div>

    就寝
    <input type="range" min="0" max="23" id="bed" oninput="updateLabels()">
    <div id="bedLabel"></div>

    <button class="main" onclick="saveSleep()">保存</button>

  </div>
</div>

<!-- まとめ -->
<div id="graphScreen" class="container" style="display:none;">
  <div class="card" id="summary"></div>

  <div class="card" style="text-align:center;">
    <button onclick="changeWeek(-1)">←</button>
    <span id="weekLabel"></span>
    <button onclick="changeWeek(1)">→</button>
  </div>

  <div class="card">
    <canvas id="chart"></canvas>
  </div>
</div>

<!-- タブ -->
<div class="tabbar">
  <div class="tab activeTab" onclick="showTab('log')" id="tabLog">記録</div>
  <div class="tab" onclick="showTab('sleep')" id="tabSleep">睡眠</div>
  <div class="tab" onclick="showTab('graph')" id="tabGraph">まとめ</div>
</div>

</div>

<script>
let data = {};
let tags = [];
let activeTag = null;
let currentWeekOffset = 0;
let chart;

const dateInput = document.getElementById("date");
dateInput.value = new Date().toISOString().split("T")[0];

function saveData(){
  localStorage.setItem("lifeLog", JSON.stringify({data,tags}));
}

function loadData(){
  const saved = JSON.parse(localStorage.getItem("lifeLog")||"{}");
  data = saved.data || {};
  tags = saved.tags || [];
}

function getCurrentData(){
  const d = dateInput.value;
  if(!data[d]) data[d]={logs:[],wake:7,bed:23};
  return data[d];
}

function addLog(){
  const text = document.getElementById("text").value;
  const tag = document.getElementById("tagInput").value;
  if(!text) return;

  const d = getCurrentData();
  d.logs.push({text,tag});

  if(tag && !tags.includes(tag)) tags.push(tag);

  saveData();
  render();

  document.getElementById("text").value="";
  document.getElementById("tagInput").value="";
}

function render(){
  renderTags();

  const list=document.getElementById("list");
  list.innerHTML="";

  const d=getCurrentData();

  d.logs
  .map((log, index) => ({log, index}))
  .filter(item => !activeTag || item.log.tag === activeTag)
  .forEach(item => {
    const div=document.createElement("div");
    div.className="card";

    div.innerHTML = `
      ${item.log.text} [${item.log.tag}]
      <button onclick="deleteLog(${item.index})" style="float:right">削除</button>
    `;

    list.appendChild(div);
  });

  wake.value=d.wake;
  bed.value=d.bed;
  updateLabels();
}

function deleteLog(i){
  const d=getCurrentData();
  d.logs.splice(i,1);
  saveData();
  render();
}

function renderTags(){
  const area=document.getElementById("tagButtons");
  area.innerHTML="";
  tags.forEach(tag=>{
    const btn=document.createElement("button");
    btn.textContent=tag;
    btn.className=tag===activeTag?"tag active":"tag";
    btn.onclick=()=>{
      activeTag = activeTag===tag ? null : tag;
      render();
    };
    area.appendChild(btn);
  });
}

function showTab(tab){
  ["log","sleep","graph"].forEach(t=>{
    document.getElementById(t+"Screen").style.display="none";
    document.getElementById("tab"+capitalize(t)).classList.remove("activeTab");
  });

  document.getElementById(tab+"Screen").style.display="block";
  document.getElementById("tab"+capitalize(tab)).classList.add("activeTab");

  if(tab==="graph"){
    renderSummary();
    renderChart();
  }
}

function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function updateLabels(){
  wakeLabel.textContent = wake.value + ":00";
  bedLabel.textContent = bed.value + ":00";
}

function saveSleep(){
  const d=getCurrentData();
  d.wake=Number(wake.value);
  d.bed=Number(bed.value);
  saveData();

  alert("保存しました！");
}

function getSleepHours(wake,bed){
  let h=wake-bed;
  if(h<0) h+=24;
  return h;
}

function renderSummary(){
  const d=getCurrentData();
  summary.innerHTML=`
    今日のまとめ<br>
    記録：${d.logs.length}件<br>
    睡眠：${getSleepHours(d.wake,d.bed)}時間
  `;
}

function getWeekDates(offset){
  const today=new Date();
  today.setDate(today.getDate()+offset*7);

  const day=today.getDay();
  const monday=new Date(today);
  monday.setDate(today.getDate()-day+1);

  let days=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday);
    d.setDate(monday.getDate()+i);
    days.push(d.toISOString().split("T")[0]);
  }
  return days;
}

function renderChart(){
  const dates=getWeekDates(currentWeekOffset);

  weekLabel.textContent = dates[0]+" ～ "+dates[6];

  const logs=[];
  const sleep=[];

  dates.forEach(date=>{
    const d=data[date]||{logs:[],wake:7,bed:23};
    logs.push(d.logs.length);
    sleep.push(getSleepHours(d.wake,d.bed));
  });

  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels:dates,
      datasets:[
        {label:"記録数",data:logs},
        {label:"睡眠時間",data:sleep}
      ]
    }
  });
}

function changeWeek(n){
  currentWeekOffset+=n;
  renderChart();
}

loadData();
render();
</script>

</body>
</html>
